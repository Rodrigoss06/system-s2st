# SINCRO Engine v4 - desarrollo local con Docker Compose
#
# Levanta Dispatcher + Worker en la misma red.
# El Worker necesita modelos ONNX (~200 MB), la primera build tarda.
#
# Uso:
#   1. cp .env.example .env  y rellena las credenciales + SINCRO_TOKEN_SECRET
#   2. docker compose build
#   3. docker compose up
#
#   Dispatcher: http://localhost:8000
#   Worker WS:  ws://localhost:8080

services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SINCRO_LOG_LEVEL=${SINCRO_LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  dispatcher:
    build:
      context: .
      dockerfile: Dockerfile.dispatcher
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - SINCRO_WORKER_WS_URL=ws://worker:8080/v1/stream
      - SINCRO_VOICES_DB=/app/data/voices.db
      - SINCRO_LOG_LEVEL=${SINCRO_LOG_LEVEL:-INFO}
    volumes:
      - voices_data:/app/data
    restart: unless-stopped
    depends_on:
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  voices_data: